
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#130d12">
<title>Per te, con amore 🌻</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&display=swap');

:root {
    --gold: #ffca38;
    --yellow: #ffe36b;
    --green: #427a42;
    --dark: #130d12;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    min-height: 100%;
    background: var(--dark);
}

body {
    min-height: 100svh;
    overflow-x: hidden;
    color: #fff4d8;
    font-family: 'Cormorant Garamond', serif;
    background:
        radial-gradient(ellipse at 50% 43%,
            #44301d 0%, #261b22 36%,
            #130d12 76%);
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    opacity: .22;
    background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E");
}

.ambient {
    position: fixed;
    width: 65vw;
    height: 65vw;
    max-width: 700px;
    max-height: 700px;
    left: 50%;
    top: 43%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, #ffb52b12, transparent 70%);
    pointer-events: none;
}

main {
    position: relative;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 42px 12px 35px;
    isolation: isolate;
}

.heading {
    position: relative;
    z-index: 3;
    text-align: center;
    animation: appear 2s ease both;
}

.eyebrow {
    font-family: 'Cormorant Garamond', serif;
    text-transform: uppercase;
    letter-spacing: .35em;
    font-size: 10px;
    color: #eacb8d;
    margin-bottom: 15px;
}

h1 {
    font-family: 'Great Vibes', cursive;
    font-weight: 400;
    font-size: clamp(44px, 8vw, 76px);
    line-height: 1.1;
    color: #ffe4a0;
    text-shadow:
        0 0 20px #ffcc5140,
        0 3px 30px #0008;
}

.subtitle {
    margin-top: 12px;
    font-size: clamp(15px, 2.5vw, 19px);
    font-style: italic;
    letter-spacing: .04em;
    color: #e8d6c2;
}

.bouquet-wrap {
    position: relative;
    width: min(100%, 760px);
    margin-top: -4px;
    filter: drop-shadow(0 25px 32px #0005);
}

.bouquet-wrap::before {
    content: "";
    position: absolute;
    width: 90%;
    height: 70%;
    left: 5%;
    top: 12%;
    border-radius: 50%;
    background: #ffc53612;
    filter: blur(55px);
}

#bouquet {
    position: relative;
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
}

.stem {
    fill: none;
    stroke: url(#stemGradient);
    stroke-width: 8;
    stroke-linecap: round;
}

.leaf {
    fill: url(#leafGradient);
    stroke: #83a654;
    stroke-width: 1.3;
}

.leaf-vein {
    fill: none;
    stroke: #b2c77b;
    stroke-width: 1;
    opacity: .6;
}

.flower {
    transform-box: view-box;
    transform-origin: 0 0;
    animation: bloom 1.5s cubic-bezier(.2,.8,.2,1) both;
}

.flower-sway {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: sway 5s ease-in-out infinite;
}

.petal {
    stroke: #e9a522;
    stroke-width: .8;
    stroke-linejoin: round;
}

.petal-back {
    fill: #df8c13;
}

.petal-main {
    fill: url(#petalGradient);
}

.petal-light {
    fill: #ffe887;
    stroke: #f8bd31;
    stroke-width: .7;
}

.flower-center {
    fill: url(#centerGradient);
    stroke: #6d3c19;
    stroke-width: 2;
}

.seed {
    fill: #24150e;
}

.seed-light {
    fill: #b17a3d;
}

.wrapper {
    stroke: #f6dfbd;
    stroke-width: 1.5;
    stroke-linejoin: round;
}

.wrapper-back {
    fill: #aa7b50;
}

.wrapper-left {
    fill: #e2c49e;
}

.wrapper-right {
    fill: #c79b6f;
}

.wrapper-front {
    fill: #f0d8b5;
}

.ribbon {
    fill: url(#ribbonGradient);
    stroke: #f6c66b;
    stroke-width: 1.4;
}

.caption {
    position: relative;
    z-index: 3;
    text-align: center;
    max-width: 490px;
    margin: -6px 15px 0;
    animation: appear 2s 1s ease both;
}

.quote {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(29px, 5vw, 43px);
    line-height: 1.25;
    color: #ffe2a0;
    text-shadow: 0 0 22px #ffca3833;
}

.small-heart {
    margin-top: 14px;
    color: #e7b75d;
    font-size: 17px;
    letter-spacing: .7em;
    padding-left: .7em;
    animation: heartGlow 3s ease-in-out infinite;
}

.petalfall {
    position: fixed;
    top: -35px;
    left: var(--x);
    width: var(--size);
    height: calc(var(--size) * 1.5);
    background: linear-gradient(145deg, #ffe789, #f5a817 70%, #d7800c);
    border-radius: 90% 10% 85% 15%;
    opacity: 0;
    pointer-events: none;
    z-index: 4;
    animation: fall var(--duration) var(--delay) linear infinite;
    filter: drop-shadow(0 0 5px #ffc33155);
}

.sparkle {
    position: fixed;
    width: var(--size);
    height: var(--size);
    left: var(--x);
    top: var(--y);
    border-radius: 50%;
    background: #ffe9a5;
    box-shadow: 0 0 10px 2px #ffcf6544;
    pointer-events: none;
    z-index: 1;
    animation: twinkle var(--duration) var(--delay) ease-in-out infinite alternate;
}

@keyframes bloom {
    from {
        opacity: 0;
        scale: .15;
    }
    to {
        opacity: 1;
        scale: 1;
    }
}

@keyframes sway {
    0%, 100% { rotate: -1.3deg; }
    50% { rotate: 1.3deg; }
}

@keyframes fall {
    0% {
        transform: translate3d(0, -5vh, 0) rotate(0deg);
        opacity: 0;
    }
    10% { opacity: .85; }
    85% { opacity: .65; }
    100% {
        transform: translate3d(var(--drift), 110vh, 0)
                   rotate(var(--spin));
        opacity: 0;
    }
}

@keyframes twinkle {
    from { opacity: .12; transform: scale(.6); }
    to { opacity: .9; transform: scale(1.5); }
}

@keyframes heartGlow {
    0%, 100% { opacity: .6; }
    50% { opacity: 1; }
}

@keyframes appear {
    from { opacity: 0; translate: 0 15px; }
    to { opacity: 1; translate: 0 0; }
}

@media (min-width: 700px) {
    main {
        padding-top: 30px;
    }

    .bouquet-wrap {
        width: min(100%, 740px);
        margin-top: -18px;
    }

    .caption {
        margin-top: -30px;
    }
}

@media (max-width: 420px) {
    main {
        padding: 32px 5px 28px;
    }

    .eyebrow {
        font-size: 9px;
        letter-spacing: .25em;
    }

    .bouquet-wrap {
        margin-top: 5px;
    }

    .caption {
        margin-top: -10px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
    }
}
</style>
</head>

<body>
<div class="ambient"></div>

<main>
    <header class="heading">
        <p class="eyebrow"></p>
        <h1>Per te, amore mio</h1>
        <p class="subtitle">Se potessi, ti regalerei tutti i girasoli del mondo.</p>
    </header>

    <div class="bouquet-wrap">
        <svg id="bouquet" viewBox="0 0 700 650"
             xmlns="http://www.w3.org/2000/svg"
             role="img"
             aria-label="Un grande mazzo animato di girasoli gialli con foglie verdi e fiocco dorato">

            <defs>
                <linearGradient id="petalGradient" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#fff39a"/>
                    <stop offset=".35" stop-color="#ffdc46"/>
                    <stop offset=".72" stop-color="#ffb91e"/>
                    <stop offset="1" stop-color="#e88b0c"/>
                </linearGradient>

                <radialGradient id="centerGradient" cx=".35" cy=".3" r=".8">
                    <stop offset="0" stop-color="#98602c"/>
                    <stop offset=".5" stop-color="#593319"/>
                    <stop offset="1" stop-color="#29170f"/>
                </radialGradient>

                <linearGradient id="stemGradient" x1="0" y1="0" x2="1" y2="0">
                    <stop stop-color="#254d2d"/>
                    <stop offset=".5" stop-color="#639047"/>
                    <stop offset="1" stop-color="#315c32"/>
                </linearGradient>

                <linearGradient id="leafGradient" x1="0" y1="0" x2="1" y2="1">
                    <stop stop-color="#83a953"/>
                    <stop offset=".5" stop-color="#417b3c"/>
                    <stop offset="1" stop-color="#244d30"/>
                </linearGradient>

                <linearGradient id="ribbonGradient" x1="0" y1="0" x2="1" y2="1">
                    <stop stop-color="#ffe7a0"/>
                    <stop offset=".4" stop-color="#e9aa37"/>
                    <stop offset=".65" stop-color="#c9851f"/>
                    <stop offset="1" stop-color="#ffe0a0"/>
                </linearGradient>

                <linearGradient id="paperGradient" x1="0" y1="0" x2="1" y2="1">
                    <stop stop-color="#f7e7cc"/>
                    <stop offset="1" stop-color="#c9a27b"/>
                </linearGradient>

                <filter id="flowerShadow" x="-40%" y="-40%"
                        width="180%" height="180%">
                    <feDropShadow dx="0" dy="3" stdDeviation="3"
                                  flood-color="#17100a" flood-opacity=".3"/>
                </filter>
            </defs>

            <!-- Steli -->
            <g id="stems"></g>

            <!-- Foglie -->
            <g id="leaves"></g>

            <!-- Piccoli fiori decorativi -->
            <g id="fillers"></g>

            <!-- Carta del mazzo -->
            <g filter="url(#flowerShadow)">
                <path class="wrapper wrapper-back"
                    d="M102 355 Q350 450 598 355 L485 600 Q350 637 215 600 Z"/>

                <path class="wrapper wrapper-left"
                    fill="url(#paperGradient)"
                    d="M102 355 L350 464 L215 600 Z"/>

                <path class="wrapper wrapper-right"
                    d="M598 355 L350 464 L485 600 Z"/>

                <path class="wrapper wrapper-front"
                    fill="url(#paperGradient)"
                    d="M102 355 Q350 470 598 355 L445 580 Q350 611 255 580 Z"/>

                <path d="M115 365 Q350 470 585 365"
                    fill="none" stroke="#fff1d7" stroke-width="3" opacity=".8"/>

                <path d="M144 385 L260 568 M556 385 L440 568"
                    fill="none" stroke="#ba936b" stroke-width="1.5" opacity=".7"/>
            </g>

            <!-- Girasoli -->
            <g id="flowers"></g>

            <!-- Fiocco -->
            <g filter="url(#flowerShadow)">
                <path class="ribbon"
                    d="M344 485
                       C285 435 235 475 280 511
                       L344 495 Z"/>

                <path class="ribbon"
                    d="M356 485
                       C415 435 465 475 420 511
                       L356 495 Z"/>

                <path class="ribbon"
                    d="M341 497 L306 568 L350 548 L365 590 L362 497 Z"/>

                <path class="ribbon"
                    d="M359 497 L394 568 L350 548 L335 590 L338 497 Z"/>

                <ellipse cx="350" cy="490" rx="19" ry="15"
                    fill="url(#ribbonGradient)" stroke="#f8d78d" stroke-width="2"/>

                <path d="M340 490 Q350 480 360 490 Q350 500 340 490"
                    fill="none" stroke="#fff0bc" stroke-width="1.5"/>
            </g>
        </svg>
    </div>

    <section class="caption">
        <p class="quote">
            Sei il mio tutto, mi manchi da morire.<br>
        </p>
        <div class="small-heart">✧ ♥ ✧</div>
    </section>
</main>

<script>
const svgNS = "http://www.w3.org/2000/svg";

function el(tag, attrs = {}) {
    const node = document.createElementNS(svgNS, tag);
    for (const [key, value] of Object.entries(attrs)) {
        node.setAttribute(key, value);
    }
    return node;
}

const flowersGroup = document.getElementById("flowers");
const stemsGroup = document.getElementById("stems");
const leavesGroup = document.getElementById("leaves");
const fillersGroup = document.getElementById("fillers");

// Coordinate del mazzo: i fiori centrali sono più grandi.
const flowers = [
    {x:160,y:120,r:48,d:0},
    {x:265,y:88,r:51,d:.15},
    {x:385,y:82,r:53,d:.3},
    {x:500,y:120,r:47,d:.45},

    {x:102,y:204,r:47,d:.2},
    {x:215,y:190,r:53,d:.4},
    {x:330,y:169,r:61,d:.1},
    {x:453,y:191,r:54,d:.5},
    {x:565,y:211,r:45,d:.25},

    {x:155,y:287,r:48,d:.35},
    {x:278,y:279,r:56,d:.15},
    {x:405,y:283,r:54,d:.45},
    {x:525,y:290,r:48,d:.2},

    {x:220,y:365,r:43,d:.5},
    {x:345,y:355,r:50,d:.25},
    {x:466,y:365,r:43,d:.4},

    {x:315,y:430,r:34,d:.3},
    {x:390,y:420,r:31,d:.15}
];

function makeFlower(f, index) {
    const group = el("g", {
        transform: `translate(${f.x} ${f.y})`,
        class: "flower",
        filter: "url(#flowerShadow)",
        style: `animation-delay:${f.d}s`
    });

    const swayGroup = el("g", {class: "flower-sway"});
    const petals = el("g");

    // Petali posteriori, più scuri, per dare profondità.
    for (let i = 0; i < 20; i++) {
        const petal = el("ellipse", {
            cx: 0,
            cy: -f.r * .67,
            rx: f.r * .22,
            ry: f.r * .48,
            class: "petal petal-back",
            transform: `rotate(${i * 18 + 9})`
        });
        petals.appendChild(petal);
    }

    // Petali principali, lunghi e luminosi.
    for (let i = 0; i < 20; i++) {
        const petal = el("ellipse", {
            cx: 0,
            cy: -f.r * .66,
            rx: f.r * .185,
            ry: f.r * .43,
            class: "petal petal-main",
            transform: `rotate(${i * 18})`
        });
        petals.appendChild(petal);
    }

    // Seconda corona di petali più piccoli.
    for (let i = 0; i < 18; i++) {
        const petal = el("ellipse", {
            cx: 0,
            cy: -f.r * .47,
            rx: f.r * .13,
            ry: f.r * .31,
            class: "petal petal-light",
            transform: `rotate(${i * 20 + 10})`
        });
        petals.appendChild(petal);
    }

    swayGroup.appendChild(petals);

    // Centro vellutato.
    swayGroup.appendChild(el("circle", {
        r: f.r * .48,
        class: "flower-center"
    }));

    // Semi disposti a spirale.
    const seedCount = 115;
    for (let i = 0; i < seedCount; i++) {
        const radius = f.r * .44 * Math.sqrt((i + .5) / seedCount);
        const angle = i * 2.39996;

        const seed = el("ellipse", {
            cx: (Math.cos(angle) * radius).toFixed(2),
            cy: (Math.sin(angle) * radius).toFixed(2),
            rx: Math.max(1, f.r * .025),
            ry: Math.max(1, f.r * .033),
            class: i % 4 === 0 ? "seed-light" : "seed",
            transform:
                `rotate(${(angle * 180 / Math.PI).toFixed(2)} ` +
                `${(Math.cos(angle)*radius).toFixed(2)} ` +
                `${(Math.sin(angle)*radius).toFixed(2)})`
        });

        swayGroup.appendChild(seed);
    }

    group.appendChild(swayGroup);
    return group;
}

// Gli steli vengono disegnati prima dei fiori.
flowers.forEach((f, i) => {
    const startX = 350 + (f.x - 350) * .17;
    const startY = 545;

    const controlX = (startX + f.x) / 2 + (f.x - 350) * .1;
    const controlY = (startY + f.y) / 2 + 30;

    stemsGroup.appendChild(el("path", {
        d: `M ${startX} ${startY}
            Q ${controlX} ${controlY} ${f.x} ${f.y}`,
        class: "stem",
        style: `animation:appear 1.5s ${f.d}s both`
    }));
});

// Foglie appuntite con nervature.
const leafData = [
    [210,390,-135,1.0],[280,425,-45,.9],
    [165,330,-155,.85],[330,395,35,.9],
    [390,385,-25,1.0],[465,340,35,.85],
    [520,315,25,.8],[235,285,145,.8],
    [350,320,-140,.75],[435,270,30,.85],
    [290,245,-155,.8],[390,235,20,.8],
    [175,255,150,.75],[500,245,35,.8],
    [245,460,-155,.8],[455,440,25,.8]
];

leafData.forEach(([x,y,angle,scale]) => {
    const g = el("g", {
        transform: `translate(${x} ${y}) rotate(${angle}) scale(${scale})`
    });

    g.appendChild(el("path", {
        d: "M 0 0 C -22 -18 -48 -48 -8 -67 C 22 -45 24 -18 0 0 Z",
        class: "leaf"
    }));

    g.appendChild(el("path", {
        d: "M 0 0 Q -6 -28 -8 -64",
        class: "leaf-vein"
    }));

    leavesGroup.appendChild(g);
});

// Piccoli fiori bianchi riempitivi.
for (let i = 0; i < 115; i++) {
    const x = 105 + Math.random() * 490;
    const y = 185 + Math.random() * 220;
    const size = 1.5 + Math.random() * 2.5;

    const g = el("g", {
        transform: `translate(${x} ${y})`,
        opacity: .7 + Math.random() * .3
    });

    for (let j = 0; j < 5; j++) {
        g.appendChild(el("ellipse", {
            cx: 0,
            cy: -size,
            rx: size * .6,
            ry: size,
            fill: "#fff5d9",
            transform: `rotate(${j * 72})`
        }));
    }

    g.appendChild(el("circle", {
        r: size * .45,
        fill: "#e6b84c"
    }));

    fillersGroup.appendChild(g);
}

// Aggiunge i fiori in ordine: prima quelli dietro, poi quelli davanti.
[...flowers]
    .sort((a,b) => a.y - b.y)
    .forEach((f, i) => flowersGroup.appendChild(makeFlower(f, i)));

// Petali dorati che cadono continuamente.
for (let i = 0; i < 20; i++) {
    const petal = document.createElement("div");
    petal.className = "petalfall";
    petal.style.setProperty("--x", Math.random() * 100 + "vw");
    petal.style.setProperty("--size", (5 + Math.random() * 9) + "px");
    petal.style.setProperty("--duration", (8 + Math.random() * 12) + "s");
    petal.style.setProperty("--delay", (-Math.random() * 20) + "s");
    petal.style.setProperty("--drift", (-100 + Math.random() * 200) + "px");
    petal.style.setProperty("--spin", (180 + Math.random() * 720) + "deg");
    document.body.appendChild(petal);
}

// Piccole luci che brillano sullo sfondo.
for (let i = 0; i < 36; i++) {
    const sparkle = document.createElement("div");
    sparkle.className = "sparkle";
    sparkle.style.setProperty("--x", Math.random() * 100 + "vw");
    sparkle.style.setProperty("--y", Math.random() * 100 + "vh");
    sparkle.style.setProperty("--size", (1 + Math.random() * 3) + "px");
    sparkle.style.setProperty("--duration", (2 + Math.random() * 4) + "s");
    sparkle.style.setProperty("--delay", (-Math.random() * 5) + "s");
    document.body.appendChild(sparkle);
}
</script>
</body>
</html>
